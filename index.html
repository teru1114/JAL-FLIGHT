const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];

// ===== LSP計算 =====
// 国内線: 1搭乗=5LSP、国際線: floor(区間マイル/1000)×5LSP
function calcLSP(from, to, segMiles) {
  const isDomestic = DOMESTIC_AIRPORTS.has(from.toUpperCase()) && DOMESTIC_AIRPORTS.has(to.toUpperCase());
  if (isDomestic) {
    // 国内線: 搭乗1回=5LSP（FOP積算対象外でも付与）
    return 5;
  } else {
    // 国際線: 1000区間マイルごとに5LSP
    if (!segMiles) return 0;
    return Math.floor(segMiles / 1000) * 5;
  }
}

// 今日の日付（アプリ基準日）

function calcFOP(from, to, opts) {
  const key = `${from.toUpperCase()}-${to.toUpperCase()}`;
  if (isInternational(from, to)) {
    const segMiles = INTL_SEGMENT_MILES[key] || null;
    if (!segMiles) return null;
    const bookClass = (opts.intlClass || "Y").toUpperCase();
    const rate = INTL_CLASS_RATES[bookClass] ?? 1.0;
    const fopRate = getIntlFopRate(from, to);
    const bonus = INTL_BOARDING_BONUS[bookClass] ?? 0;
    const flightMiles = segMiles * rate;
    return {
      fop: Math.floor(flightMiles * fopRate) + bonus,
      flightMiles,
      segMiles,
      bonus,
      type: "international",
      fopRate
    };
  } else {
    const segMiles = opts.manualMiles || SEGMENT_MILES[key] || null;
    if (!segMiles) return null;
    const fareRate = opts.fareRate || "f1";
    const rate = DOM_FARE_RATES[fareRate] ?? 1.0;
    const classAdd = DOM_CLASS_ADD[opts.seatClass || "普通席"] ?? 0;
    const bonus = DOM_BOARDING_BONUS[fareRate] ?? 400;
    // FOP = (区間マイル×積算率 ＋ 区間マイル×クラス加算率) × 2（国内線） ＋ 搭乗ボーナス
    // フライトマイルの端数は四捨五入（実績ベースで確認:
    //   HND-HIJ 株主割引 414×0.75=310.5 →311マイル→1022FOP
    //   HND-FUK 株主割引 567×0.75=425.25→425マイル→1250FOP）
    const flightMiles = Math.round(segMiles * rate + segMiles * classAdd);
    return {
      fop: flightMiles * 2 + bonus,
      flightMiles,
      segMiles,
      bonus,
      type: "domestic"
    };
  }
}
