const LSP_FLIGHT_CUTOFF = (() => {
  const d = new Date();
  d.setDate(d.getDate() - 3);
  // 端末ローカル日付で判定（toISOString=UTCだと日本時間0〜9時に1日ずれるため）
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
})();

const LSP_STATUS_TIERS = [[12000, "JGC Six Star"], [6000, "JGC Five Star"], [3000, "JGC Four Star"], [1500, "JGC Three Star"], [500, "JMB elite plus"], [250, "JMB elite"]];
function getLspStatus(lsp) {
  const t = LSP_STATUS_TIERS.find(([min]) => lsp >= min);
  return t ? t[1] : null;
}
function isLspAccrued(f) {
  return !!f.date && f.date <= LSP_FLIGHT_CUTOFF;
}
// FOPの実績計上は搭乗日の3日後（フライト・FOPボーナス共通）
const FOP_FLIGHT_CUTOFF = (() => {
  const d = new Date();
  d.setDate(d.getDate() - 3);
  // 端末ローカル日付で判定（toISOString=UTCだと日本時間0〜9時に1日ずれるため）
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
})();
function isFopAccrued(f) {
  return !!f.date && f.date <= FOP_FLIGHT_CUTOFF;
}
const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];
function getWeekday(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr);
  return isNaN(d) ? "" : WEEKDAYS[d.getDay()];
}

// ===== LSP計算 =====
// 国内線: 1搭乗=5LSP、国際線: floor(区間マイル/1000)×5LSP
function calcLSP(from, to, segMiles) {
  const isDomestic = DOMESTIC_AIRPORTS.has(from.toUpperCase()) && DOMESTIC_AIRPORTS.has(to.toUpperCase());
  if (isDomestic) {
    // 国内線: 搭乗1回=5LSP（FOP積算対象外でも付与）
    return 5;
  } else {
    // 国際線: 1000区間マイルごとに5LSP
    if (!segMiles) return 0;
    return Math.floor(segMiles / 1000) * 5;
  }
}

// ===== ステータス判定 =====
function getStatus(fop, count) {
  if (fop >= 80000 || count >= 80) return {
    label: "JGCプレミア",
    ow: "emerald",
    owName: "エメラルド",
    color: "#0ca040",
    bg: "rgba(12,160,64,0.15)",
    border: "#0ca040"
  };
  if (fop >= 50000 || count >= 50) return {
    label: "サファイア",
    ow: "sapphire",
    owName: "サファイア",
    color: "#1565c0",
    bg: "rgba(21,101,192,0.15)",
    border: "#1565c0"
  };
  if (fop >= 30000 || count >= 30) return {
    label: "クリスタル",
    ow: "ruby",
    owName: "ルビー",
    color: "#e4003d",
    bg: "rgba(228,0,61,0.15)",
    border: "#e4003d"
  };
  return null;
}

// 達成年から有効期限を返す（翌々年3月末）
function getStatusExpiry(achievedYear) {
  return `${parseInt(achievedYear) + 2}年3月末`;
}
function getNextStatus(fop, count) {
  if (fop >= 80000 || count >= 80) return null; // 最高ステータス達成
  if (fop >= 50000 || count >= 50) return {
    label: "JGCプレミア",
    needFop: 80000,
    needCount: 80,

  if (fop >= 30000 || count >= 30) return {

    color: "#e53935"
  };
}

// 今日の日付（アプリ基準日）

function calcFOP(from, to, opts) {
  const key = `${from.toUpperCase()}-${to.toUpperCase()}`;
  if (isInternational(from, to)) {
    const segMiles = INTL_SEGMENT_MILES[key] || null;
    if (!segMiles) return null;
    const bookClass = (opts.intlClass || "Y").toUpperCase();
    const rate = INTL_CLASS_RATES[bookClass] ?? 1.0;
    const fopRate = getIntlFopRate(from, to);
    const bonus = INTL_BOARDING_BONUS[bookClass] ?? 0;
    const flightMiles = segMiles * rate;
    return {
      fop: Math.floor(flightMiles * fopRate) + bonus,
      flightMiles,
      segMiles,
      bonus,
      type: "international",
      fopRate
    };
  } else {
    const segMiles = opts.manualMiles || SEGMENT_MILES[key] || null;
    if (!segMiles) return null;
    const fareRate = opts.fareRate || "f1";
    const rate = DOM_FARE_RATES[fareRate] ?? 1.0;
    const classAdd = DOM_CLASS_ADD[opts.seatClass || "普通席"] ?? 0;
    const bonus = DOM_BOARDING_BONUS[fareRate] ?? 400;
    // FOP = (区間マイル×積算率 ＋ 区間マイル×クラス加算率) × 2（国内線） ＋ 搭乗ボーナス
    // フライトマイルの端数は四捨五入（実績ベースで確認:
    //   HND-HIJ 株主割引 414×0.75=310.5 →311マイル→1022FOP
    //   HND-FUK 株主割引 567×0.75=425.25→425マイル→1250FOP）
    const flightMiles = Math.round(segMiles * rate + segMiles * classAdd);
    return {
      fop: flightMiles * 2 + bonus,
      flightMiles,
      segMiles,
      bonus,
      type: "domestic"
    };
  }
}
